<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">

scene.add(new THREE.HemisphereLight(0xffffff,0x526548,2));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-15,25,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-26;sun.shadow.camera.right=26;sun.shadow.camera.top=26;sun.shadow.camera.bottom=-26;sun.shadow.normalBias=.015;scene.add(sun);

const roadEdges=[];for(const side of [-1,1]){const edge=new THREE.Mesh(new THREE.BoxGeometry(.13,.018,2000),mat(0xe3decb));edge.position.set(side*5.84,.019,0);scene.add(edge);roadEdges.push(edge);}
const landscape=[];const trunkMat=mat(0x70513b),leafMat=mat(0x356448),leafMat2=mat(0x4b7855),houseMat=[mat(0xc3b69b),mat(0xd6c5a8),mat(0x9faeba),mat(0xc7c7bc)];const roofMat=mat(0x9f5c46),postMat=mat(0x666c70);

 }putLandscape(group,z);
}
for(let i=0;i<29;i++)for(const side of [-1,1]){
 const group=new THREE.Group();group.position.x=side*7;
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.055,.075,5,6),postMat);pole.position.y=2.5;group.add(pole);

 putLandscape(group,-145+i*10);
}
const signGroup=new THREE.Group();signGroup.position.x=-10;
const signPost=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,3.4,6),postMat);signPost.position.y=1.7;signGroup.add(signPost);
const signBoard=new THREE.Mesh(new THREE.BoxGeometry(4.2,1.45,.18),mat(0x173b49));signBoard.position.y=3.9;signGroup.add(signBoard);
putLandscape(signGroup,-65);
const stripes=[];for(let i=0;i<25;i++){const s=new THREE.Mesh(new THREE.PlaneGeometry(.14,3),white);s.rotation.x=-Math.PI/2;s.position.set(0,.03,-i*12+12);scene.add(s);stripes.push(s)}
const rider=new THREE.Group();scene.add(rider);const rearPivot=new THREE.Group();rider.add(rearPivot);const pitch=new THREE.Group();rearPivot.add(pitch);rearPivot.position.set(0,.36,.93);pitch.position.set(0,-.36,-.93);let wheelSpin=0,wheelUniform=null;const fallbackWheels=[];

cube(1.25,.3,1.65,0xb71f26,0,1.13,0);cube(.7,.22,.7,0x181a1c,0,1.39,.25);cube(.85,.14,.38,0x272a2e,0,1.55,-.6);cube(1.65,.13,.16,0x9fa7ac,0,1.9,-.73);

let modelLoaded=false;
const modelStatus=document.getElementById('modelStatus');
function useFourtrax(sceneModel){
  const model=sceneModel;
  model.updateMatrixWorld(true);
  let bounds=new THREE.Box3().setFromObject(model),dimensions=bounds.getSize(new THREE.Vector3());
  if(dimensions.x>dimensions.z*1.2){model.rotation.y=-Math.PI/2;model.updateMatrixWorld(true);bounds.setFromObject(model);dimensions=bounds.getSize(new THREE.Vector3());}
  if(![dimensions.x,dimensions.y,dimensions.z].every(Number.isFinite)||Math.max(dimensions.x,dimensions.y,dimensions.z)<.001)throw new Error('El modelo 3D no contiene geometría visible.');

  model.scale.multiplyScalar(scale);model.updateMatrixWorld(true);
  bounds.setFromObject(model);const ctr=bounds.getCenter(new THREE.Vector3());
  model.position.set(model.position.x-ctr.x,model.position.y-bounds.min.y+.02,model.position.z-ctr.z);
  model.updateMatrixWorld(true);
  model.traverse(obj=>{if(obj.isMesh){obj.castShadow=true;obj.receiveShadow=true;}});
  pitch.clear();fallbackWheels.length=0;pitch.add(model);animateImportedTires(model);modelLoaded=true;
  modelStatus.textContent='✓ HONDA FOURTRAX 3D CARGADO';
}

function animateImportedTires(sceneModel) {
  wheelUniform={value:0};
  sceneModel.traverse(object=>{
    if(!object.isMesh)return;
    // El archivo Honda GLB original trae las cuatro gomas en UNA malla.
    // Mover sus vértices en el shader permite girarlas sin borrar su textura.
    const material=object.material.clone();object.material=material;
    material.onBeforeCompile=shader=>{
      shader.uniforms.uWheelSpin=wheelUniform;
      shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\n uniform float uWheelSpin;');
      shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
float wheelZ=(position.z<0.0)?-0.65:0.61;
float dy=position.y+0.33, dz=position.z-wheelZ;
float mask=step(0.29,abs(position.x))*step(0.36,abs(position.z))*(1.0-smoothstep(0.215,0.245,length(vec2(dy,dz))));
float a=uWheelSpin*mask;
float cs=cos(a),sn=sin(a);
transformed.y=-0.33+cs*dy-sn*dz;
transformed.z=wheelZ+sn*dy+cs*dz;
`);
      shader.vertexShader=shader.vertexShader.replace('#include <beginnormal_vertex>',`#include <beginnormal_vertex>
float zc=(position.z<0.0)?-0.65:0.61;
float rr=length(vec2(position.y+0.33,position.z-zc));
float nm=step(0.29,abs(position.x))*step(0.36,abs(position.z))*(1.0-smoothstep(0.215,0.245,rr));
float wa=uWheelSpin*nm;
float yc=objectNormal.y, zc2=objectNormal.z;
objectNormal.y=cos(wa)*yc-sin(wa)*zc2;
objectNormal.z=sin(wa)*yc+cos(wa)*zc2;
`);
    };
    material.customProgramCacheKey=()=> 'huxcasti-fourtrax-rotating-tires-v2';
    material.needsUpdate=true;
  });
}
const loader=new GLTFLoader();
function loadFourtrax(source){
  return new Promise((resolve,reject)=>{
    const temp=typeof source==='string'?null:URL.createObjectURL(source);
    loader.load(temp||source,gltf=>{
      if(temp)URL.revokeObjectURL(temp);
      try{useFourtrax(gltf.scene);resolve()}catch(err){reject(err)}
    },undefined,err=>{if(temp)URL.revokeObjectURL(temp);reject(err)});
  });
}
function openModelStorage(){
 return new Promise((resolve,reject)=>{
   if(!window.indexedDB){reject(new Error('IndexedDB no disponible'));return}
   const req=indexedDB.open('WheelieFourtrax',1);
   req.onupgradeneeded=()=>req.result.createObjectStore('files');
   req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function savedModelFile(){
 const db=await openModelStorage();
 return new Promise((resolve,reject)=>{
 const tx=db.transaction('files','readonly'),req=tx.objectStore('files').get('fourtrax');
 req.onsuccess=()=>{resolve(req.result);db.close()};req.onerror=()=>{reject(req.error);db.close()};
 });
}
async function persistModel(file){
 const db=await openModelStorage();
 return new Promise((resolve,reject)=>{
 const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,'fourtrax');
 tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};
 });
}
const fileButton=document.getElementById('pickModel');

 const file=fileInput.files?.[0];if(!file)return;
 modelStatus.textContent='Cargando modelo '+(file.size/1048576).toFixed(1)+' MB…';
 try{await loadFourtrax(file);await persistModel(file)}
 catch(err){console.error(err);modelStatus.textContent='Error al cargar: elige un archivo .glb válido';}

});
(async()=>{
 try{await loadFourtrax('./assets/3d-honda-fourtrax-atv.glb');return}catch(err){console.info('Archivo remoto aún no cargado.',err)}
 try{
 const saved=await savedModelFile();
 if(saved){await loadFourtrax(saved);return}
 }catch(err){console.info('Sin modelo guardado.',err)}

})();
const keys={gas:false,lift:false,up:false,down:false};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const set=v=>{keys[k]=v;b.classList.toggle('pressed',v)};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>set(false))});
const keymap={ArrowUp:'gas',Space:'lift',ArrowLeft:'down',ArrowRight:'up',KeyW:'gas',KeyS:'down',KeyD:'up'};addEventListener('keydown',e=>{if(keymap[e.code]){keys[keymap[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(keymap[e.code])keys[keymap[e.code]]=false});
let active=false,speed=0,tilt=0,elapsed=0,record=Number(localStorage.getItem('wheelie-best')||0),distance=0,last=performance.now(),wasWheelie=false;
const timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),angleEl=document.querySelector('#angle'),message=document.querySelector('#message'),start=document.querySelector('#start');bestEl.textContent=record.toFixed(2)+' s';
function reset(){document.body.classList.add('playing');active=true;speed=0;tilt=0;elapsed=0;distance=0;wasWheelie=false;rider.position.set(0,0,0);pitch.rotation.set(0,0,0);wheelSpin=0;message.textContent='¡ACELERA!';start.hidden=true}

function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.04);last=now;
if(active){speed=Math.max(0,Math.min(24,speed+(keys.gas?9:-7)*dt));distance+=speed*dt;let force=(keys.lift&&speed>3?1.6:0)+(keys.down?.85:0)-(keys.up?1.4:0);tilt+=((force-.56-Math.sin(tilt)*.15)*dt);tilt=Math.max(-.12,tilt);const valid=tilt>.20&&tilt<1.12&&speed>2;
