<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Wheelie Challenge</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#101820;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
    canvas{display:block}
    #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:20}
    .pill{background:#07121acc;border:1px solid #ffffff30;border-radius:16px;padding:10px 12px;font-weight:800;min-width:0;flex:1;text-align:left;box-shadow:0 10px 20px #00000025}
    .pill small{display:block;color:#bfd0d4;font-size:11px;line-height:1.1;margin-bottom:2px}
    .pill span{font-size:18px;line-height:1.05}
    #message{position:fixed;top:22%;left:50%;transform:translateX(-50%);width:min(92vw,560px);text-align:center;text-shadow:0 4px 18px #000;font-size:clamp(24px,5vw,42px);font-weight:900;pointer-events:none;z-index:15}
    #start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 28px;border:0;border-radius:16px;background:#1dc9a0;color:#06251f;font-weight:900;font-size:20px;z-index:15;box-shadow:0 12px 26px #00000035}
    #modelPicker{position:fixed;left:50%;top:calc(50% + 56px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,370px);z-index:16}
    #pickModel{background:#143d4b;color:#d8fff2;padding:12px 18px;border:1px solid #6ccac4;border-radius:14px;font-weight:800;font-size:12px;box-shadow:0 8px 18px #00000030}
    #modelStatus{font-size:11px;color:#e8f0f1;text-shadow:0 2px 4px #000;background:#0a2635b9;padding:5px 10px;border-radius:10px;text-align:center}
    #controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 14px;z-index:18}
    .side{display:flex;gap:12px;align-items:flex-end}
    .right{margin-left:auto}
    .btn{appearance:none;border:1px solid #ffffff66;border-radius:24px;background:#183149e6;color:#fff;font-weight:900;font-size:18px;min-width:96px;height:88px;touch-action:none;user-select:none;box-shadow:0 8px 22px #0000002a;backdrop-filter:blur(2px)}
    .btn.pressed,.btn:active{background:#1da09c}
    .btn.small{min-width:118px;height:84px}
    .btn.gas{min-width:112px;height:108px;background:#1d8a72e6;font-size:20px}
    .btn.wheelie{min-width:112px;height:94px;background:#183149ee}
    #hint{position:fixed;left:16px;right:16px;bottom:128px;text-align:center;color:#ebf3f5;font-size:14px;text-shadow:0 2px 6px #000;pointer-events:none;z-index:17}
    body.playing #modelPicker{display:none}
    @media (max-width:540px){
      #controls{gap:8px;padding:0 8px}
      .side{flex:1;min-width:0;gap:7px}
      .right{margin-left:0}
      .btn,.btn.small,.btn.wheelie,.btn.gas{flex:1;min-width:0;width:100%;font-size:clamp(11px,3.1vw,16px);padding:0 4px;border-radius:18px}
      .btn.small{height:83px}
      .btn.wheelie{height:94px}
      .btn.gas{height:108px}
      #hint{bottom:126px;font-size:12px}
    }
    @media (max-width:430px){
      #controls{gap:10px;padding:0 10px}
      .side{gap:10px}
      .btn{min-width:90px;height:82px;font-size:16px;border-radius:22px}
      .btn.small{min-width:104px;height:80px}
      .btn.wheelie{min-width:102px;height:86px}
      .btn.gas{min-width:104px;height:102px}
      #hint{bottom:122px;font-size:12px}
      .pill span{font-size:17px}
    }
  
    /* Ajuste final: cuatro controles visibles sin desbordarse en iPhone */
    @media (max-width:540px){
      #controls{gap:8px;padding:0 8px;bottom:max(10px,env(safe-area-inset-bottom))}
      #controls .side{flex:1;min-width:0;gap:7px;margin-left:0}
      #controls .btn,#controls .btn.small,#controls .btn.wheelie,#controls .btn.gas{min-width:0;width:100%;flex:1;padding:0 3px;font-size:clamp(11px,3.1vw,16px);border-radius:18px}
      #controls .btn.small{height:82px}
      #controls .btn.wheelie{height:92px}
      #controls .btn.gas{height:106px}
    }

    /* Dos controles grandes, separados y sin selección, lupa ni menú Copiar de iOS */
    html, body, body *, button, canvas {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-drag: none;
    }
    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 0 clamp(16px, 5vw, 44px);
      z-index: 30;
      touch-action: none;
      -webkit-touch-callout: none;
    }
    #controls > .btn, #controls > .btn.wheelie, #controls > .btn.gas {
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: clamp(122px, 36vw, 182px);
      min-width: 0;
      height: 106px;
      border-radius: 24px;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 900;
      padding: 0 7px;
      cursor: pointer;
      white-space: nowrap;
      touch-action: none;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent;
    }
    #controls > .btn.gas {background:#188c76; height:112px}
    #controls > .btn.wheelie {background:#19364a; height:100px}
    #controls > .btn.pressed, #controls > .btn:active {
      background:#29a9a0;
      border-color:#9df2eb;
      transform:scale(.98);
    }
    #hint { bottom: 148px; font-size: 12px; line-height: 1.35; padding: 0 10px; }
    @media (max-width:350px){
      #controls {padding: 0 12px;gap:10px}
      #controls > .btn, #controls > .btn.wheelie, #controls > .btn.gas {width: 43vw;}
    }

    /* Mando de manubrio al lado del FourTrax, con espacio para los dos pedales */
    #controls{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:0 clamp(10px,3vw,26px);z-index:31}
    #controls > .steering-control{flex:0 0 auto;width:clamp(106px,31vw,146px);height:clamp(106px,31vw,146px);position:relative;
      border:2px solid #b9e9e0aa;border-radius:50%;background:radial-gradient(circle at 45% 35%,#263e4aee,#0c1a22ed);
      box-shadow:inset 0 3px 15px #0009,0 8px 24px #0008;touch-action:none;cursor:grab;display:flex;justify-content:center;align-items:center;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .steering-control::before{content:"DIRECCIÓN";position:absolute;top:-20px;left:0;right:0;text-align:center;
      color:#e3f7f0;font-size:10px;font-weight:800;text-shadow:0 2px 4px #000}
    #steering-wheel{width:90%;height:90%;border-radius:50%;display:grid;place-items:center;pointer-events:none;transition:transform .09s linear}
    #steering-wheel svg{width:96%;height:96%;filter:drop-shadow(0 2px 2px #0009)}
    #controls > .btn,#controls > .btn.wheelie,#controls > .btn.gas{flex:0 1 auto;min-width:0;width:clamp(83px,27vw,142px);
      height:clamp(92px,30vw,116px);border-radius:20px;font-size:clamp(13px,3.8vw,18px)}
    #controls > .btn.gas{height:clamp(101px,32vw,124px)}
    #hint{bottom:clamp(145px,37vw,178px);font-size:clamp(11px,2.8vw,14px)}
    #roadAlert{position:fixed;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 96px);transform:translateX(-50%);
      background:#11232bba;color:#fff5d1;border:1px solid #ffdc81a0;padding:7px 12px;border-radius:12px;
      font-size:12px;font-weight:800;white-space:nowrap;z-index:24;pointer-events:none;opacity:0;transition:opacity .25s}
    #roadAlert.visible{opacity:1}
    @media (max-width:375px){
      #controls{padding:0 8px;gap:6px}
      #controls > .steering-control{width:102px;height:102px}
      #controls > .btn,#controls > .btn.wheelie,#controls > .btn.gas{width:calc((100vw - 136px)/2);font-size:12px;height:94px}
      #controls > .btn.gas{height:106px}
      #hint{bottom:140px}
    }

    /* Interfaz de un solo botón de acción; el círculo es el control de dirección. */
    #controls{justify-content:space-between;gap:18px;padding:0 clamp(16px,5vw,45px)}
    #controls > .btn.gas {margin-left:auto;width:clamp(128px,37vw,190px);height:clamp(112px,34vw,142px);font-size:clamp(18px,4.5vw,23px);border-radius:28px}
    #controls > .steering-control{width:clamp(116px,32vw,156px);height:clamp(116px,32vw,156px)}
    #hint{bottom:clamp(156px,41vw,190px);max-width:440px;margin:auto;left:12px;right:12px}
    @media(max-width:375px){
      #controls{gap:12px;padding:0 10px}
      #controls > .steering-control{width:108px;height:108px}
      #controls > .btn.gas{width:clamp(128px,39vw,160px);height:116px}
      #hint{bottom:150px}
    }
</style>
</head>
<body>
  <div id="hud">
    <div class="pill"><small>WHEELIE ACTUAL</small><span id="time">0.00 s</span></div>
    <div class="pill"><small>RÉCORD PERSONAL</small><span id="best">0.00 s</span></div>
    <div class="pill"><small>ÁNGULO</small><span id="angle">0°</span></div>
  </div>

  <div id="roadAlert" role="status" aria-live="off"></div>
  <div id="message">WHEELIE CHALLENGE</div>
  <button id="start">COMENZAR</button>

  <div id="modelPicker">
    <button id="pickModel" type="button">📂 CARGAR HONDA FOURTRAX 3D</button>
    <span id="modelStatus">Modelo 3D: pendiente</span>
    <input id="modelFile" type="file" accept=".glb,model/gltf-binary" hidden>
  </div>

  <div id="hint">Mantén GAS para acelerar y levantar el FourTrax. Suelta para bajar las ruedas.</div>

  <div id="controls" aria-label="Controles táctiles del juego">
    <div id="steering" class="steering-control" role="slider" tabindex="0"
         aria-label="Manubrio de dirección" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0">
      <div id="steering-wheel">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="48" fill="none" stroke="#81999c" stroke-width="7"/>
          <circle cx="60" cy="60" r="40" fill="none" stroke="#28464f" stroke-width="4"/>
          <path d="M14 44 L30 44 Q60 56 90 44 L106 44" fill="none" stroke="#e9ece6" stroke-width="7" stroke-linecap="round"/>
          <path d="M15 39 L26 39 M94 39 L105 39" fill="none" stroke="#17272a" stroke-width="13" stroke-linecap="round"/>
          <path d="M60 45 L60 77" stroke="#b5c5c5" stroke-width="8" stroke-linecap="round"/>
          <circle cx="60" cy="61" r="12" fill="#45b9a5" stroke="#ddece7" stroke-width="3"/>
          <path d="M32 88 Q60 101 88 88" fill="none" stroke="#81b8a9" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <button class="btn gas" data-key="gas" type="button" aria-label="Acelerar y hacer wheelie">GAS</button>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9cc5d5);
    scene.fog = new THREE.Fog(0x9cc5d5, 28, 155);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x587257, 2.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(-16, 24, 18);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -28;
    sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 28;
    sun.shadow.camera.bottom = -28;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);

    const mat = (c, rough = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: rough });
    const groundMat = mat(0x679969);
    const roadMat = mat(0x363d44, 0.95);
    const shoulderMat = mat(0xbf9d73);
    const stripeMat = mat(0xf3eed6, 0.65);
    const edgeMat = mat(0xe4ddcb, 0.7);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.12;
    ground.receiveShadow = true;
    scene.add(ground);

    const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 2000), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0;
    road.receiveShadow = true;
    scene.add(road);

    const shoulder = new THREE.Mesh(new THREE.PlaneGeometry(15, 2000), shoulderMat);
    shoulder.rotation.x = -Math.PI / 2;
    shoulder.position.y = -0.04;
    shoulder.receiveShadow = true;
    scene.add(shoulder);

    const roadEdges = [];
    for (const side of [-1, 1]) {
      const edge = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.018, 2000), edgeMat);
      edge.position.set(side * 5.84, 0.019, 0);
      edge.receiveShadow = true;
      scene.add(edge);
      roadEdges.push(edge);
    }

    const stripes = [];
    for (let i = 0; i < 25; i++) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 3.0), stripeMat);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.03, -i * 12 + 12);
      scene.add(stripe);
      stripes.push(stripe);
    }

    const landscape = [];
    const treeTrunkGeo = new THREE.CylinderGeometry(0.18, 0.22, 2.2, 6);
    const treeLeafGeo = new THREE.ConeGeometry(1.4, 3.2, 7);
    const houseGeo = new THREE.BoxGeometry(5.5, 3.2, 5.2);
    const roofGeo = new THREE.ConeGeometry(4.0, 1.9, 4);
    const trunkMat = mat(0x71513c);
    const leafA = mat(0x356548);
    const leafB = mat(0x517d54);
    const roofMat = mat(0xa55f46);
    const houseMats = [mat(0xc7b89e), mat(0xd6cdb8), mat(0xa9b9c4), mat(0xcfc8bb)];
    const poleMat = mat(0x6b6f74);

    function registerScenery(group, z) {
      group.userData.baseZ = z;
      scene.add(group);
      landscape.push(group);
    }

    for (let i = 0; i < 34; i++) {
      for (const side of [-1, 1]) {
        const group = new THREE.Group();
        group.position.x = side * (9.5 + (i % 4) * 2.1);
        const z = -150 + i * 9 + side * 2;
        if (i % 6 === 0) {
          const house = new THREE.Mesh(houseGeo, houseMats[i % houseMats.length]);
          house.position.y = 1.6;
          house.castShadow = house.receiveShadow = true;
          group.add(house);
          const roof = new THREE.Mesh(roofGeo, roofMat);
          roof.rotation.y = Math.PI / 4;
          roof.position.y = 4.1;
          roof.castShadow = true;
          group.add(roof);
        } else {
          for (let j = 0; j < 2; j++) {
            const x = (j - 0.5) * 2.7;
            const trunk = new THREE.Mesh(treeTrunkGeo, trunkMat);
            trunk.position.set(x, 1.1, 0);
            trunk.castShadow = true;
            group.add(trunk);
            const crown = new THREE.Mesh(treeLeafGeo, i % 2 ? leafA : leafB);
            crown.position.set(x, 3.0, 0);
            crown.castShadow = true;
            group.add(crown);
          }
        }
        registerScenery(group, z);
      }
    }

    for (let i = 0; i < 28; i++) {
      for (const side of [-1, 1]) {
        const group = new THREE.Group();
        group.position.x = side * 7.2;
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 5.0, 6), poleMat);
        pole.position.y = 2.5;
        pole.castShadow = true;
        group.add(pole);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.12), poleMat);
        arm.position.set(-side * 0.48, 4.85, 0);
        group.add(arm);
        const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.09, 0.3), new THREE.MeshBasicMaterial({ color: 0xfff0bd }));
        lamp.position.set(-side * 0.88, 4.75, 0);
        group.add(lamp);
        registerScenery(group, -145 + i * 10);
      }
    }


    /* Badenes, lomos y conos en el recorrido: se reciclan por delante del jugador. */
    const obstacles = [];
    const trackLength = 310;
    const warnEl = document.getElementById('roadAlert');
    function humpGeo(width, length, height) {
      const vertices = [], indices = [];
      const subdivisions = 12;
      for (let i=0; i<=subdivisions; i++){
        const t=i/subdivisions;
        const y=.028+height*Math.sin(Math.PI*t);
        const z=(t-.5)*length;
        vertices.push(-width/2,y,z, width/2,y,z);
        if(i<subdivisions){let a=i*2;indices.push(a,a+2,a+1,a+1,a+2,a+3)}
      }
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
      g.setIndex(indices);g.computeVertexNormals();return g;
    }
    const yellowBump=mat(0xecc13b),blackBump=mat(0x242728),concreteBump=mat(0x9da0a0);
    function addHump(baseZ,kind,height,length){
      const group=new THREE.Group();
      const count=kind==='badén'?1:12;
      const width=10.8/count;
      for(let i=0;i<count;i++){
        const material=kind==='badén'?concreteBump:(i%2?blackBump:yellowBump);
        material.side=THREE.DoubleSide;
        const m=new THREE.Mesh(humpGeo(width+.012,length,height),material);
        m.position.x=-5.4+width*(i+.5);
        m.castShadow=true;m.receiveShadow=true;group.add(m);
      }
      group.position.z=baseZ;scene.add(group);
      obstacles.push({group,baseZ,kind,height,length,width:10.8,hit:false});
    }
    function addCones(baseZ,side){
      const group=new THREE.Group();
      group.position.set(side*2.65,0,baseZ);
      const coneColor=mat(0xf68223),coneWhite=mat(0xf4ece2);
      for(let k=0;k<3;k++){
        const cone=new THREE.Mesh(new THREE.ConeGeometry(.27,.72,8),coneColor);
        cone.position.set((k-1)*.65,.37,0);cone.castShadow=true;group.add(cone);
        const stripe=new THREE.Mesh(new THREE.CylinderGeometry(.15,.21,.10,8),coneWhite);
        stripe.position.set((k-1)*.65,.31,0);group.add(stripe);
        const foot=new THREE.Mesh(new THREE.BoxGeometry(.45,.07,.45),blackBump);
        foot.position.set((k-1)*.65,.04,0);group.add(foot);
      }
      scene.add(group);obstacles.push({group,baseZ,kind:'conos',height:.7,length:1,width:2,hit:false});
    }
    addHump(-38,'reductor',.17,1.7);
    addCones(-66,-1);
    addHump(-100,'badén',.37,4.2);
    addHump(-148,'reductor',.19,1.3);
    addCones(-192,1);
    addHump(-232,'badén',.28,3.5);
    addHump(-282,'reductor',.22,1.7);

    function positionObstacles(traveled){
      for(const o of obstacles){
        let relative=o.baseZ+traveled;
        while(relative>24)relative-=trackLength;
        while(relative<-trackLength+24)relative+=trackLength;
        const pos=-traveled+relative;
        if(Math.abs(pos-o.group.position.z)>trackLength*.5)o.hit=false;
        o.group.position.z=pos;
      }
    }
    function obstacleHeightAt(z,x){
      if(Math.abs(x)>5.5)return 0;
      let height=0;
      for(const o of obstacles){
        if(o.kind==='conos')continue;
        const t=(z-o.group.position.z)/o.length+.5;
        if(t>0&&t<1)height=Math.max(height,o.height*Math.sin(Math.PI*t));
      }
      return height;
    }
    function updateObstacleGameplay(dt) {
      positionObstacles(distance);
      const frontHeight=obstacleHeightAt(rider.position.z-vehicleLength*.35,rider.position.x);
      const rearHeight=obstacleHeightAt(rider.position.z+rearAxleZ*.9,rider.position.x);
      const surfaceHeight=Math.max(frontHeight,rearHeight);
      rider.position.y=THREE.MathUtils.damp(rider.position.y,surfaceHeight+Math.sin(Math.max(0,tilt))*.05,12,dt);
      // El badén desestabiliza el wheelie, más notable a velocidad alta.
      if(surfaceHeight>.04)tilt=Math.max(-.05,tilt+(frontHeight-rearHeight)*dt*Math.min(3,speed*.12));
      for(const o of obstacles){
        if(o.kind!=='conos'||o.hit)continue;
        const inZ=Math.abs(o.group.position.z-rider.position.z)<.85;
        const inX=Math.abs(o.group.position.x-rider.position.x)<1.35;
        if(inZ&&inX){
          o.hit=true;speed*=.57;tilt=Math.min(1.62,tilt+.20);
          messageEl.textContent='¡GOLPEASTE LOS CONOS!';
        }
      }
      let closest=null;
      for(const o of obstacles){
        const d=rider.position.z-o.group.position.z;
        if(d>0&&d<36&&(!closest||d<closest.d))closest={o,d};
      }
      if(closest){
        warnEl.textContent='⚠ '+(closest.o.kind==='conos'?'CONOS':closest.o.kind==='badén'?'BADÉN':'REDUCTOR')+' · '+Math.ceil(closest.d)+' m';
        warnEl.classList.add('visible');
      }else warnEl.classList.remove('visible');
    }
    positionObstacles(0);

    const rider = new THREE.Group();
    scene.add(rider);
    const rearPivot = new THREE.Group();
    rider.add(rearPivot);
    const vehicle = new THREE.Group();
    rearPivot.add(vehicle);

    let importedModel = null;
    let importedWheelGroups = [];
    let modelLoaded = false;
    let realTireRotation = null;
    let vehicleLength = 1.85;
    let rearAxleZ = 0.75;
    let bodyClearance = 0.18;
    let avatar = null;

    function clearVehicle() {
      while (vehicle.children.length) vehicle.remove(vehicle.children[0]);
      importedWheelGroups = [];
      realTireRotation = null;
    }

    function makeWheel(radius = 0.34, tube = 0.12) {
      const group = new THREE.Group();
      const tire = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 12, 24), new THREE.MeshStandardMaterial({ color: 0x1f2427, roughness: 0.92 }));
      tire.rotation.y = Math.PI / 2;
      tire.castShadow = tire.receiveShadow = true;
      group.add(tire);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.45, radius * 0.45, tube * 1.05, 16), new THREE.MeshStandardMaterial({ color: 0xb8c1c6, roughness: 0.45, metalness: 0.15 }));
      hub.rotation.z = Math.PI / 2;
      hub.castShadow = hub.receiveShadow = true;
      group.add(hub);
      return group;
    }


    // Conductor 3D estilizado inspirado en la fotografía del jugador:
    // cabello negro corto con fade, camisa blanca de mangas cortas,
    // pantalón oscuro, reloj blanco y manos sobre el manubrio.
    // Creado con geometría; la fotografía privada no se sube a GitHub.
    function createAvatar() {
      const person = new THREE.Group();
      person.name = 'Conductor personalizado';
      const skin = mat(0xb78060, .82), skinShade = mat(0x9d674e, .9);
      const hair = mat(0x1b1718, .96), fadedHair = mat(0x352b28, .95);
      const shirt = mat(0xf1f0e8, .8), collar = mat(0xe5e4de, .88);
      const pants = mat(0x202731, .95), shoes = mat(0x121519, .91);
      const eyes = mat(0x36251c), eyeWhite=mat(0xf5eee4), black = mat(0x2b2221);
      const watch = mat(0xf3f2eb,.5), watchFace = mat(0x393f48,.5);

      const ellipsoid = (parent,material,pos,scales,seg=12) => {
        const m = new THREE.Mesh(new THREE.SphereGeometry(1,seg,9),material);
        m.position.set(...pos);m.scale.set(...scales);m.castShadow=true;parent.add(m);return m;
      };
      const limb = (parent,a,b,rad,material) => {
        const av=new THREE.Vector3(...a), bv=new THREE.Vector3(...b);
        const dir=bv.clone().sub(av);
        const m=new THREE.Mesh(new THREE.CylinderGeometry(rad*.91,rad,dir.length(),9),material);
        m.position.copy(av).add(bv).multiplyScalar(.5);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
        m.castShadow=true;parent.add(m);return m;
      };
      const box=(parent,pos,size,material)=>{
        const m=new THREE.Mesh(new THREE.BoxGeometry(...size),material);
        m.position.set(...pos);m.castShadow=true;parent.add(m);return m;
      };
      // El modelo mira hacia el frente de la pista (-Z).
      ellipsoid(person,pants,[0,1.10,.21],[.31,.19,.25]);
      // Piernas sentadas, rodillas hacia adelante.
      for (const side of [-1,1]) {
        const hip=[side*.17,1.12,.18],knee=[side*.27,.89,-.29],ankle=[side*.34,.61,-.35];
        limb(person,hip,knee,.145,pants);
        ellipsoid(person,pants,knee,[.15,.13,.16]);
        limb(person,knee,ankle,.105,pants);
        ellipsoid(person,shoes,[side*.34,.56,-.45],[.15,.09,.24]);
      }
      // Torso ligeramente inclinado hacia el guía.
      const chest = ellipsoid(person,shirt,[0,1.56,.07],[.34,.37,.20]);
      chest.rotation.x=-.16;
      box(person,[0,1.38,.20],[.45,.19,.22],shirt);
      // Cuello y cuello abierto de camisa tipo polo.
      limb(person,[0,1.80,.02],[0,1.93,-.015],.099,skin);
      for(const side of [-1,1]){
        const collarPiece=ellipsoid(person,collar,[side*.09,1.83,-.12],[.095,.075,.03]);
        collarPiece.rotation.z=side*.33;
        const shoulder=[side*.32,1.71,.045];
        const elbow=[side*.42,1.43,-.29];
        const wrist=[side*.51,1.42,-.69];
        limb(person,shoulder,[side*.37,1.54,-.10],.137,shirt);
        limb(person,[side*.37,1.54,-.10],elbow,.104,skin);
        ellipsoid(person,skin,elbow,[.092,.096,.092]);
        limb(person,elbow,wrist,.082,skin);
        ellipsoid(person,skin,[side*.51,1.42,-.70],[.108,.072,.105]);
        if(side===-1){
          const wristWatch=ellipsoid(person,watch,[side*.495,1.424,-.60],[.10,.096,.065]);
          ellipsoid(person,watchFace,[side*.495,1.49,-.60],[.067,.018,.045]);
        }
      }
      // Forma de la cara y peinado corto de lados rebajados (sin textura fotográfica).
      const head=ellipsoid(person,skin,[0,2.085,-.02],[.205,.244,.19],20);
      ellipsoid(person,skin,[-.198,2.07,-.025],[.047,.075,.041]);
      ellipsoid(person,skin,[ .198,2.07,-.025],[.047,.075,.041]);
      ellipsoid(person,hair,[0,2.265,-.014],[.209,.074,.191],20);
      ellipsoid(person,fadedHair,[-.172,2.187,.007],[.033,.06,.14]);
      ellipsoid(person,fadedHair,[.172,2.187,.007],[.033,.06,.14]);
      // Rasgos visibles en cámara frontal, discretos y estilizados.
      for(const side of [-1,1]){
        ellipsoid(person,eyeWhite,[side*.083,2.103,-.190],[.046,.027,.011]);
        ellipsoid(person,eyes,[side*.083,2.102,-.201],[.022,.023,.012]);
        const brow=box(person,[side*.083,2.151,-.195],[.085,.014,.015],hair);
        brow.rotation.z=side*.10;
      }
      ellipsoid(person,skinShade,[0,2.03,-.211],[.036,.055,.036]);
      ellipsoid(person,black,[0,1.967,-.189],[.069,.012,.009]);
      person.position.set(0,0.04,.14);
      return person;
    }
    function attachAvatar(){
      if(!avatar)avatar=createAvatar();
      vehicle.add(avatar);
    }

    function buildFallbackATV() {
      clearVehicle();
      const shell = new THREE.Group();
      const red = mat(0xb61d24, 0.7);
      const dark = mat(0x1d2024, 0.85);
      const gray = mat(0x9ea7ac, 0.75);
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.33, 1.7), red);
      body.position.set(0, 0.86, 0.05);
      body.castShadow = body.receiveShadow = true;
      shell.add(body);
      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.72), dark);
      seat.position.set(0, 1.12, 0.08);
      seat.castShadow = seat.receiveShadow = true;
      shell.add(seat);
      const rackF = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 0.38), gray);
      rackF.position.set(0, 1.05, -0.76);
      rackF.castShadow = true;
      shell.add(rackF);
      const rackR = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.45), gray);
      rackR.position.set(0, 1.02, 0.87);
      rackR.castShadow = true;
      shell.add(rackR);
      vehicle.add(shell);
      const wheelPositions = [
        [-0.78, 0.45, -0.72],
        [ 0.78, 0.45, -0.72],
        [-0.78, 0.45,  0.72],
        [ 0.78, 0.45,  0.72],
      ];
      for (const pos of wheelPositions) {
        const w = makeWheel(0.33, 0.13);
        w.position.set(...pos);
        vehicle.add(w);
        importedWheelGroups.push(w);
      }
      attachAvatar();
      importedModel = null;
      vehicleLength = 1.7;
      rearAxleZ = 0.72;
      bodyClearance = 0.14;
      modelLoaded = false;
    }

    buildFallbackATV();

    const loader = new GLTFLoader();
    const tmpBox = new THREE.Box3();
    const tmpSize = new THREE.Vector3();
    const tmpCenter = new THREE.Vector3();
    const modelStatus = document.getElementById('modelStatus');

    function normalizeImportedModel(model) {
      model.updateMatrixWorld(true);
      tmpBox.setFromObject(model);
      tmpBox.getSize(tmpSize);
      if (tmpSize.x > tmpSize.z * 1.2) {
        model.rotation.y = -Math.PI / 2;
        model.updateMatrixWorld(true);
        tmpBox.setFromObject(model);
        tmpBox.getSize(tmpSize);
      }
      // Forzar que mire hacia el frente de la carretera.
      model.rotation.y += Math.PI;
      model.updateMatrixWorld(true);
      tmpBox.setFromObject(model);
      tmpBox.getSize(tmpSize);

      const scale = 2.45 / Math.max(tmpSize.x, tmpSize.z);
      model.scale.setScalar(scale);
      model.updateMatrixWorld(true);
      tmpBox.setFromObject(model);
      tmpBox.getCenter(tmpCenter);
      tmpBox.getSize(tmpSize);

      const lift = 0.22;
      model.position.set(model.position.x - tmpCenter.x, model.position.y - tmpBox.min.y + lift, model.position.z - tmpCenter.z);
      model.updateMatrixWorld(true);

      model.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });

      vehicleLength = tmpSize.z;
      rearAxleZ = tmpSize.z * 0.33;
      bodyClearance = lift;

      // No colocar neumáticos artificiales encima de las gomas del Honda.
      // En el GLB original todos los neumáticos forman parte de una sola malla.
      importedWheelGroups = [];
      enableOriginalTireRotation(model);
    }


    function enableOriginalTireRotation(model) {
      // La geometría de este Honda FourTrax es una única malla texturizada:
      // animamos las regiones de las cuatro gomas en la GPU, sin ruedas falsas.
      const spin = { value: 0 };
      const nl = String.fromCharCode(10);
      const tireFunctions = [
        'uniform float uFourtraxWheelAngle;',
        'float fourtraxWheelMask(vec3 p) {',
        '  float cz = p.z < 0.0 ? -0.633 : 0.590;',
        '  float radius = length(vec2(p.y + 0.286, p.z - cz));',
        '  return smoothstep(0.322, 0.362, abs(p.x)) * (1.0 - smoothstep(0.249, 0.311, radius));',
        '}',
        'vec3 fourtraxRotatePoint(vec3 p) {',
        '  float a = uFourtraxWheelAngle * fourtraxWheelMask(p);',
        '  float c = cos(a), sn = sin(a);',
        '  float cz = p.z < 0.0 ? -0.633 : 0.590;',
        '  float dy = p.y + 0.286, dz = p.z - cz;',
        '  return vec3(p.x, -0.286 + c * dy - sn * dz, cz + sn * dy + c * dz);',
        '}',
        'vec3 fourtraxRotateNormal(vec3 p, vec3 n) {',
        '  float a = uFourtraxWheelAngle * fourtraxWheelMask(p);',
        '  float c = cos(a), sn = sin(a);',
        '  return vec3(n.x, c*n.y - sn*n.z, sn*n.y + c*n.z);',
        '}'
      ].join(nl);
      let modifiedCount = 0;
      model.traverse(obj => {
        if (!obj.isMesh || !obj.geometry?.getAttribute('position')) return;
        const sourceMaterials = Array.isArray(obj.material) ? obj.material : [obj.material];
        const materials = sourceMaterials.map(source => {
          const material = source.clone();
          material.onBeforeCompile = shader => {
            shader.uniforms.uFourtraxWheelAngle = spin;
            shader.vertexShader = shader.vertexShader.replace(
              '#include <common>', '#include <common>' + nl + tireFunctions
            );
            shader.vertexShader = shader.vertexShader.replace(
              '#include <beginnormal_vertex>',
              '#include <beginnormal_vertex>' + nl + 'objectNormal = fourtraxRotateNormal(position, objectNormal);'
            );
            shader.vertexShader = shader.vertexShader.replace(
              '#include <begin_vertex>',
              '#include <begin_vertex>' + nl + 'transformed = fourtraxRotatePoint(position);'
            );
          };
          material.customProgramCacheKey = () => 'fourtrax-original-wheels-shader-v5';
          material.needsUpdate = true;
          return material;
        });
        obj.material = Array.isArray(obj.material) ? materials : materials[0];
        modifiedCount++;
      });
      realTireRotation = modifiedCount ? spin : null;
    }

    function useFourtrax(sceneModel) {
      clearVehicle();
      importedModel = sceneModel;
      vehicle.add(importedModel);
      normalizeImportedModel(importedModel);
      attachAvatar();
      modelLoaded = true;
      modelStatus.textContent = '✓ HONDA FOURTRAX 3D CARGADO';
    }

    function loadFourtrax(source) {
      return new Promise((resolve, reject) => {
        const temp = typeof source === 'string' ? null : URL.createObjectURL(source);
        loader.load(temp || source, gltf => {
          if (temp) URL.revokeObjectURL(temp);
          try {
            useFourtrax(gltf.scene);
            resolve();
          } catch (err) { reject(err); }
        }, undefined, err => {
          if (temp) URL.revokeObjectURL(temp);
          reject(err);
        });
      });
    }

    function openModelStorage() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('IndexedDB no disponible')); return; }
        const req = indexedDB.open('WheelieFourtrax', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('files');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function savedModelFile() {
      const db = await openModelStorage();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readonly');
        const req = tx.objectStore('files').get('fourtrax');
        req.onsuccess = () => { resolve(req.result); db.close(); };
        req.onerror = () => { reject(req.error); db.close(); };
      });
    }
    async function persistModel(file) {
      const db = await openModelStorage();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put(file, 'fourtrax');
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      });
    }

    const fileButton = document.getElementById('pickModel');
    const fileInput = document.getElementById('modelFile');
    fileButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      modelStatus.textContent = 'Cargando modelo ' + (file.size / 1048576).toFixed(1) + ' MB…';
      try {
        await loadFourtrax(file);
        await persistModel(file);
      } catch (err) {
        console.error(err);
        modelStatus.textContent = 'Error al cargar: elige un archivo .glb válido';
        buildFallbackATV();
      }
      fileInput.value = '';
    });

    (async () => {
      try { await loadFourtrax('./assets/3d-honda-fourtrax-atv.glb'); return; } catch (err) { console.info('Archivo remoto aún no cargado.', err); }
      try { const saved = await savedModelFile(); if (saved) { await loadFourtrax(saved); return; } } catch (err) { console.info('Sin modelo guardado.', err); }
      modelStatus.textContent = 'Elige el Honda Fourtrax .glb para usarlo';
    })();


    // Guía táctil tipo manubrio: desliza lateralmente; vuelve al centro al soltar.
    const steeringEl=document.getElementById('steering');
    const steeringWheelEl=document.getElementById('steering-wheel');
    let steerValue=0,keyboardSteer=0,lateralMotion=0;
    function setSteer(value){
      steerValue=THREE.MathUtils.clamp(value,-1,1);
      steeringWheelEl.style.transform='rotate('+(-steerValue*43)+'deg)';
      steeringEl.setAttribute('aria-valuenow',String(Math.round(steerValue*100)));
    }
    function steeringAt(clientX){
      const r=steeringEl.getBoundingClientRect();
      setSteer(((clientX-r.left)/r.width-.5)*2.3);
    }
    steeringEl.addEventListener('pointerdown',e=>{
      e.preventDefault();steeringEl.setPointerCapture(e.pointerId);steeringAt(e.clientX);
    });
    steeringEl.addEventListener('pointermove',e=>{
      if(steeringEl.hasPointerCapture(e.pointerId)){e.preventDefault();steeringAt(e.clientX);}
    });
    for(const event of ['pointerup','pointercancel','lostpointercapture'])steeringEl.addEventListener(event,()=>setSteer(0));
    steeringEl.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
    steeringEl.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
    steeringEl.addEventListener('keydown',e=>{
      if(e.code==='ArrowLeft'){setSteer(-1);e.preventDefault();}
      if(e.code==='ArrowRight'){setSteer(1);e.preventDefault();}
    });
    steeringEl.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight')setSteer(0)});
    addEventListener('keydown',e=>{if(e.code==='KeyA')keyboardSteer=-1;if(e.code==='KeyD')keyboardSteer=1;});
    addEventListener('keyup',e=>{if(e.code==='KeyA'||e.code==='KeyD')keyboardSteer=0;});

    const keys = { gas: false };
    document.querySelectorAll('#controls [data-key]').forEach(btn => {
      const key = btn.dataset.key;
      const set = value => { keys[key] = value; btn.classList.toggle('pressed', value); };
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        try { btn.setPointerCapture(e.pointerId); } catch (err) {}
        set(true);
      });
      // Evita que Safari interprete una pulsación larga como texto para copiar.
      btn.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
      btn.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => set(false));
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    window.addEventListener('blur', () => {
      keys.gas = false;
      document.querySelectorAll('#controls .pressed').forEach(b => b.classList.remove('pressed'));
    });

    const keymap = { ArrowUp: 'gas', Space: 'gas', KeyW: 'gas' };
    addEventListener('keydown', e => { if (keymap[e.code]) { keys[keymap[e.code]] = true; e.preventDefault(); } });
    addEventListener('keyup', e => { if (keymap[e.code]) keys[keymap[e.code]] = false; });

    let active = false;
    let speed = 0;
    let tilt = 0;
    let elapsed = 0;
    let distance = 0;
    let wheelSpin = 0;
    let wasWheelie = false;
    let last = performance.now();
    let record = Number(localStorage.getItem('wheelie-best') || 0);

    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const angleEl = document.getElementById('angle');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('start');
    bestEl.textContent = record.toFixed(2) + ' s';

    function reset() {
      document.body.classList.add('playing');
      active = true;
      speed = 0;
      tilt = 0;
      elapsed = 0;
      distance = 0;
      wheelSpin = 0;
      lateralMotion = 0;setSteer(0);
      positionObstacles(0);
      warnEl.classList.remove('visible');
      wasWheelie = false;
      rider.position.set(0, 0, 0);
      rearPivot.position.set(0, bodyClearance + 0.17, rearAxleZ);
      vehicle.position.set(0, -(bodyClearance + 0.17), -rearAxleZ);
      rearPivot.rotation.set(0, 0, 0);
      messageEl.textContent = '¡ACELERA!';
      startBtn.hidden = true;
    }
    startBtn.addEventListener('click', reset);

    function finish() {
      document.body.classList.remove('playing');
      active = false;
      if (elapsed > record) {
        record = elapsed;
        localStorage.setItem('wheelie-best', record.toFixed(3));
        bestEl.textContent = record.toFixed(2) + ' s';
      }
      messageEl.textContent = '¡INTENTO TERMINADO! ' + elapsed.toFixed(2) + ' s';
      startBtn.textContent = 'REINTENTAR';
      startBtn.hidden = false;
    }

    function updateRoadWrap() {
      ground.position.z = rider.position.z;
      road.position.z = rider.position.z;
      shoulder.position.z = rider.position.z;
      for (const edge of roadEdges) edge.position.z = rider.position.z;
      for (let i = 0; i < stripes.length; i++) {
        const z = 12 - i * 12;
        stripes[i].position.z = rider.position.z + ((((z + distance + 155) % 310) + 310) % 310 - 155);
      }
      for (const group of landscape) {
        group.position.z = rider.position.z + ((((group.userData.baseZ + distance + 155) % 310) + 310) % 310 - 155);
      }
    }

    function keepVehicleAboveRoad() {
      rider.updateWorldMatrix(true, true);
      tmpBox.setFromObject(vehicle);
      const minY = tmpBox.min.y;
      if (minY < 0.02) rider.position.y += 0.02 - minY;
    }

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, 0.04);
      last = now;

      if (active) {
        speed = Math.max(0, Math.min(24, speed + (keys.gas ? 9 : -6.4) * dt));
        distance += speed * dt;
        const targetSteer=steerValue || keyboardSteer;
        lateralMotion=THREE.MathUtils.damp(lateralMotion,targetSteer,6,dt);
        rider.position.x=THREE.MathUtils.clamp(rider.position.x+lateralMotion*dt*(2.2+speed*.13),-4.6,4.6);
        rider.rotation.y=-lateralMotion*.14;
        rider.rotation.z=-lateralMotion*.045;

        // Un solo botón: GAS aumenta velocidad Y levanta el frente.
        // Aceleración, inclinación y descenso reaccionan suavemente.
        // Los obstáculos aún pueden desestabilizar y provocar caída.
        const powered = keys.gas && speed > 3.2;
        const targetAngle = powered ? Math.min(1.35, 0.20 + (speed - 3.2) / 24 * 1.50) : 0;
        const reactionSpeed = powered ? 0.90 : 1.35;
        tilt = THREE.MathUtils.damp(tilt, targetAngle, reactionSpeed, dt);
        tilt = Math.max(-0.035, tilt);

        const validWheelie = tilt > 0.16 && tilt < 1.48 && speed > 2;
        if (validWheelie) {
          elapsed += dt;
          wasWheelie = true;
          messageEl.textContent = '¡MANTÉN EL EQUILIBRIO!';
        } else if (wasWheelie && tilt < 0.10) {
          finish();
        } else if (tilt >= 1.53) {
          finish();
        } else if (speed < 2) {
          messageEl.textContent = '¡ACELERA PARA LEVANTAR!';
        } else {
          messageEl.textContent = '¡MANTÉN GAS PARA LEVANTAR!';
        }

        wheelSpin = (wheelSpin + speed * dt / 0.33) % (Math.PI * 2);
        // Las cuatro gomas texturizadas del modelo real giran juntas.
        if (realTireRotation) realTireRotation.value = wheelSpin;
        for (const w of importedWheelGroups) w.rotation.x = wheelSpin;

        timeEl.textContent = elapsed.toFixed(2) + ' s';
        angleEl.textContent = Math.max(0, tilt * 180 / Math.PI).toFixed(0) + '°';
        angleEl.style.color = tilt > 1.27 ? '#ffbd8f' : '#ffffff';

        rider.position.z = -distance;
        updateObstacleGameplay(dt);
        rearPivot.position.set(0, bodyClearance + 0.17, rearAxleZ);
        vehicle.position.set(0, -(bodyClearance + 0.17), -rearAxleZ);
        rearPivot.rotation.x = tilt;
        keepVehicleAboveRoad();
        updateRoadWrap();
      }

      camera.position.lerp(new THREE.Vector3(rider.position.x*.8, 2.8+rider.position.y*.45, rider.position.z + 6.2), 0.08);
      camera.lookAt(rider.position.x, 1.15+rider.position.y*.25, rider.position.z - 2.3);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(frame);
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
