<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>Wheelie Challenge</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.pill{background:#07121acc;border:1px solid #ffffff33;border-radius:14px;padding:10px 14px;font-weight:700}small{display:block;color:#a7c5ce;font-size:11px}#message{position:fixed;top:24%;left:5%;width:90%;text-align:center;text-shadow:0 2px 8px #000;font-size:22px;font-weight:900;pointer-events:none}#controls{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:8px}.cluster{display:flex;gap:8px}.btn{border:1px solid #ffffff77;border-radius:18px;background:#172f40dd;color:white;font-weight:800;font-size:16px;min-width:68px;height:74px;touch-action:none;user-select:none}.btn:active,.btn.pressed{background:#1c9f9c}.gas{background:#137c62dd;height:96px;min-width:90px}#start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:15px 26px;border:0;border-radius:15px;background:#1dc9a0;color:#06251f;font-weight:900;font-size:19px}#hint{position:fixed;bottom:125px;left:0;width:100%;text-align:center;color:#d9e7e8;font-size:12px;pointer-events:none}@media(max-width:390px){.btn{min-width:58px;font-size:14px}}</style></head>
<body><div id="hud"><div class="pill"><small>WHEELIE ACTUAL</small><span id="time">0.00 s</span></div><div class="pill"><small>RÉCORD PERSONAL</small><span id="best">0.00 s</span></div><div class="pill"><small>ÁNGULO</small><span id="angle">0°</span></div></div><div id="message">WHEELIE CHALLENGE</div><button id="start">COMENZAR</button><div id="hint">Acelera y mantén WHEELIE. Corrige con ADELANTE / ATRÁS.</div><div id="controls"><div class="cluster"><button class="btn" data-key="down">ATRÁS</button><button class="btn" data-key="up">ADELANTE</button></div><div class="cluster"><button class="btn" data-key="lift">WHEELIE</button><button class="btn gas" data-key="gas">GAS</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc5d5);scene.fog=new THREE.Fog(0x9cc5d5,35,145);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x526548,2));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-15,25,20);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const asphalt=mat(0x353b40),grass=mat(0x58885b),white=mat(0xf4e8c0);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),grass);ground.rotation.x=-Math.PI/2;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,2000),asphalt);road.rotation.x=-Math.PI/2;road.position.y=.012;scene.add(road);
const stripes=[];for(let i=0;i<25;i++){const s=new THREE.Mesh(new THREE.PlaneGeometry(.14,3),white);s.rotation.x=-Math.PI/2;s.position.set(0,.03,-i*12+12);scene.add(s);stripes.push(s)}
const rider=new THREE.Group();scene.add(rider);const pitch=new THREE.Group();rider.add(pitch);
function cube(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);pitch.add(m);return m}
function wheel(x,z){const t=new THREE.Mesh(new THREE.TorusGeometry(.43,.16,12,20),mat(0x141719));t.rotation.y=Math.PI/2;t.position.set(x,.54,z);pitch.add(t);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.19,16),mat(0xaeb8bc));hub.rotation.z=Math.PI/2;hub.position.copy(t.position);pitch.add(hub)}
cube(1.25,.3,1.65,0xb71f26,0,1.13,0);cube(.7,.22,.7,0x181a1c,0,1.39,.25);cube(.85,.14,.38,0x272a2e,0,1.55,-.6);cube(1.65,.13,.16,0x9fa7ac,0,1.9,-.73);
for(const x of [-.75,.75])for(const z of [-.83,.83])wheel(x,z);
let modelLoaded=false;new GLTFLoader().load('./assets/fourtrax.glb',g=>{const model=g.scene;const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());if(!size.length())return;const scale=2.5/Math.max(size.x,size.z);model.scale.setScalar(scale);const b=new THREE.Box3().setFromObject(model);const center=b.getCenter(new THREE.Vector3());model.position.sub(center);model.position.y+=.95;pitch.clear();pitch.add(model);modelLoaded=true;},undefined,()=>{});
const keys={gas:false,lift:false,up:false,down:false};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const set=v=>{keys[k]=v;b.classList.toggle('pressed',v)};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>set(false))});
const keymap={ArrowUp:'gas',Space:'lift',ArrowLeft:'down',ArrowRight:'up',KeyW:'gas',KeyS:'down',KeyD:'up'};addEventListener('keydown',e=>{if(keymap[e.code]){keys[keymap[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(keymap[e.code])keys[keymap[e.code]]=false});
let active=false,speed=0,tilt=0,elapsed=0,record=Number(localStorage.getItem('wheelie-best')||0),distance=0,last=performance.now(),wasWheelie=false;
const timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best'),angleEl=document.querySelector('#angle'),message=document.querySelector('#message'),start=document.querySelector('#start');bestEl.textContent=record.toFixed(2)+' s';
function reset(){active=true;speed=0;tilt=0;elapsed=0;distance=0;wasWheelie=false;rider.position.set(0,0,0);message.textContent='¡ACELERA!';start.hidden=true}
start.addEventListener('click',reset);
function finish(){active=false;if(elapsed>record){record=elapsed;localStorage.setItem('wheelie-best',record.toFixed(3));bestEl.textContent=record.toFixed(2)+' s'}message.textContent='¡INTENTO TERMINADO! '+elapsed.toFixed(2)+' s';start.textContent='REINTENTAR';start.hidden=false}
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.04);last=now;
if(active){speed=Math.max(0,Math.min(24,speed+(keys.gas?9:-7)*dt));distance+=speed*dt;let force=(keys.lift&&speed>3?1.6:0)+(keys.down?.85:0)-(keys.up?1.4:0);tilt+=((force-.56-Math.sin(tilt)*.15)*dt);tilt=Math.max(-.12,tilt);const valid=tilt>.20&&tilt<1.12&&speed>2;
if(valid){elapsed+=dt;wasWheelie=true;message.textContent='¡MANTÉN EL EQUILIBRIO!'}else if(wasWheelie&&tilt<.13){finish()}else if(tilt>=1.12){finish()}else if(speed<2){message.textContent='¡ACELERA PARA LEVANTAR!'}else{message.textContent='¡PRESIONA WHEELIE!'}
timeEl.textContent=elapsed.toFixed(2)+' s';angleEl.textContent=Math.max(0,tilt*180/Math.PI).toFixed(0)+'°';rider.position.z=-distance;pitch.rotation.x=-tilt;
for(let i=0;i<stripes.length;i++){const z=12-i*12;stripes[i].position.z=z-Math.floor((distance+12)/300)*300}
}
camera.position.lerp(new THREE.Vector3(0,4.1,rider.position.z+8.5),.075);camera.lookAt(0,1.15,rider.position.z-3);renderer.render(scene,camera)}
requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
