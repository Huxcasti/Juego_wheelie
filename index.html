<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Wheelie Challenge</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#101820;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none}
    canvas{display:block}
    #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:20}
    .pill{background:#07121acc;border:1px solid #ffffff30;border-radius:16px;padding:10px 12px;font-weight:800;min-width:0;flex:1;text-align:left;box-shadow:0 10px 20px #00000025}
    .pill small{display:block;color:#bfd0d4;font-size:11px;line-height:1.1;margin-bottom:2px}
    .pill span{font-size:18px;line-height:1.05}
    #message{position:fixed;top:22%;left:50%;transform:translateX(-50%);width:min(92vw,560px);text-align:center;text-shadow:0 4px 18px #000;font-size:clamp(24px,5vw,42px);font-weight:900;pointer-events:none;z-index:15}
    #start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 28px;border:0;border-radius:16px;background:#1dc9a0;color:#06251f;font-weight:900;font-size:20px;z-index:15;box-shadow:0 12px 26px #00000035}
    #modelPicker{position:fixed;left:50%;top:calc(50% + 56px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,370px);z-index:16}
    #pickModel{background:#143d4b;color:#d8fff2;padding:12px 18px;border:1px solid #6ccac4;border-radius:14px;font-weight:800;font-size:12px;box-shadow:0 8px 18px #00000030}
    #modelStatus{font-size:11px;color:#e8f0f1;text-shadow:0 2px 4px #000;background:#0a2635b9;padding:5px 10px;border-radius:10px;text-align:center}
    #controls{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 14px;z-index:18}
    .side{display:flex;gap:12px;align-items:flex-end}
    .right{margin-left:auto}
    .btn{appearance:none;border:1px solid #ffffff66;border-radius:24px;background:#183149e6;color:#fff;font-weight:900;font-size:18px;min-width:96px;height:88px;touch-action:none;user-select:none;box-shadow:0 8px 22px #0000002a;backdrop-filter:blur(2px)}
    .btn.pressed,.btn:active{background:#1da09c}
    .btn.small{min-width:118px;height:84px}
    .btn.gas{min-width:112px;height:108px;background:#1d8a72e6;font-size:20px}
    .btn.wheelie{min-width:112px;height:94px;background:#183149ee}
    #hint{position:fixed;left:16px;right:16px;bottom:128px;text-align:center;color:#ebf3f5;font-size:14px;text-shadow:0 2px 6px #000;pointer-events:none;z-index:17}
    body.playing #modelPicker{display:none}
    @media (max-width:540px){
      #controls{gap:8px;padding:0 8px}
      .side{flex:1;min-width:0;gap:7px}
      .right{margin-left:0}
      .btn,.btn.small,.btn.wheelie,.btn.gas{flex:1;min-width:0;width:100%;font-size:clamp(11px,3.1vw,16px);padding:0 4px;border-radius:18px}
      .btn.small{height:83px}
      .btn.wheelie{height:94px}
      .btn.gas{height:108px}
      #hint{bottom:126px;font-size:12px}
    }
    @media (max-width:430px){
      #controls{gap:10px;padding:0 10px}
      .side{gap:10px}
      .btn{min-width:90px;height:82px;font-size:16px;border-radius:22px}
      .btn.small{min-width:104px;height:80px}
      .btn.wheelie{min-width:102px;height:86px}
      .btn.gas{min-width:104px;height:102px}
      #hint{bottom:122px;font-size:12px}
      .pill span{font-size:17px}
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="pill"><small>WHEELIE ACTUAL</small><span id="time">0.00 s</span></div>
    <div class="pill"><small>RÉCORD PERSONAL</small><span id="best">0.00 s</span></div>
    <div class="pill"><small>ÁNGULO</small><span id="angle">0°</span></div>
  </div>

  <div id="message">WHEELIE CHALLENGE</div>
  <button id="start">COMENZAR</button>

  <div id="modelPicker">
    <button id="pickModel" type="button">📂 CARGAR HONDA FOURTRAX 3D</button>
    <span id="modelStatus">Modelo 3D: pendiente</span>
    <input id="modelFile" type="file" accept=".glb,model/gltf-binary" hidden>
  </div>

  <div id="hint">Acelera y mantén WHEELIE. Corrige con ADELANTE / ATRÁS.</div>

  <div id="controls">
    <div class="side left">
      <button class="btn small" data-key="down">ATRÁS</button>
      <button class="btn small" data-key="up">ADELANTE</button>
    </div>
    <div class="side right">
      <button class="btn wheelie" data-key="lift">WHEELIE</button>
      <button class="btn gas" data-key="gas">GAS</button>
    </div>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9cc5d5);
    scene.fog = new THREE.Fog(0x9cc5d5, 28, 155);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x587257, 2.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(-16, 24, 18);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -28;
    sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 28;
    sun.shadow.camera.bottom = -28;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);

    const mat = (c, rough = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: rough });
    const groundMat = mat(0x679969);
    const roadMat = mat(0x363d44, 0.95);
    const shoulderMat = mat(0xbf9d73);
    const stripeMat = mat(0xf3eed6, 0.65);
    const edgeMat = mat(0xe4ddcb, 0.7);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.12;
    ground.receiveShadow = true;
    scene.add(ground);

    const road = new THREE.Mesh(new THREE.PlaneGeometry(12, 2000), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0;
    road.receiveShadow = true;
    scene.add(road);

    const shoulder = new THREE.Mesh(new THREE.PlaneGeometry(15, 2000), shoulderMat);
    shoulder.rotation.x = -Math.PI / 2;
    shoulder.position.y = -0.04;
    shoulder.receiveShadow = true;
    scene.add(shoulder);

    const roadEdges = [];
    for (const side of [-1, 1]) {
      const edge = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.018, 2000), edgeMat);
      edge.position.set(side * 5.84, 0.019, 0);
      edge.receiveShadow = true;
      scene.add(edge);
      roadEdges.push(edge);
    }

    const stripes = [];
    for (let i = 0; i < 25; i++) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 3.0), stripeMat);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.03, -i * 12 + 12);
      scene.add(stripe);
      stripes.push(stripe);
    }

    const landscape = [];
    const treeTrunkGeo = new THREE.CylinderGeometry(0.18, 0.22, 2.2, 6);
    const treeLeafGeo = new THREE.ConeGeometry(1.4, 3.2, 7);
    const houseGeo = new THREE.BoxGeometry(5.5, 3.2, 5.2);
    const roofGeo = new THREE.ConeGeometry(4.0, 1.9, 4);
    const trunkMat = mat(0x71513c);
    const leafA = mat(0x356548);
    const leafB = mat(0x517d54);
    const roofMat = mat(0xa55f46);
    const houseMats = [mat(0xc7b89e), mat(0xd6cdb8), mat(0xa9b9c4), mat(0xcfc8bb)];
    const poleMat = mat(0x6b6f74);

    function registerScenery(group, z) {
      group.userData.baseZ = z;
      scene.add(group);
      landscape.push(group);
    }

    for (let i = 0; i < 34; i++) {
      for (const side of [-1, 1]) {
        const group = new THREE.Group();
        group.position.x = side * (9.5 + (i % 4) * 2.1);
        const z = -150 + i * 9 + side * 2;
        if (i % 6 === 0) {
          const house = new THREE.Mesh(houseGeo, houseMats[i % houseMats.length]);
          house.position.y = 1.6;
          house.castShadow = house.receiveShadow = true;
          group.add(house);
          const roof = new THREE.Mesh(roofGeo, roofMat);
          roof.rotation.y = Math.PI / 4;
          roof.position.y = 4.1;
          roof.castShadow = true;
          group.add(roof);
        } else {
          for (let j = 0; j < 2; j++) {
            const x = (j - 0.5) * 2.7;
            const trunk = new THREE.Mesh(treeTrunkGeo, trunkMat);
            trunk.position.set(x, 1.1, 0);
            trunk.castShadow = true;
            group.add(trunk);
            const crown = new THREE.Mesh(treeLeafGeo, i % 2 ? leafA : leafB);
            crown.position.set(x, 3.0, 0);
            crown.castShadow = true;
            group.add(crown);
          }
        }
        registerScenery(group, z);
      }
    }

    for (let i = 0; i < 28; i++) {
      for (const side of [-1, 1]) {
        const group = new THREE.Group();
        group.position.x = side * 7.2;
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 5.0, 6), poleMat);
        pole.position.y = 2.5;
        pole.castShadow = true;
        group.add(pole);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.12), poleMat);
        arm.position.set(-side * 0.48, 4.85, 0);
        group.add(arm);
        const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.09, 0.3), new THREE.MeshBasicMaterial({ color: 0xfff0bd }));
        lamp.position.set(-side * 0.88, 4.75, 0);
        group.add(lamp);
        registerScenery(group, -145 + i * 10);
      }
    }

    const rider = new THREE.Group();
    scene.add(rider);
    const rearPivot = new THREE.Group();
    rider.add(rearPivot);
    const vehicle = new THREE.Group();
    rearPivot.add(vehicle);

    let importedModel = null;
    let importedWheelGroups = [];
    let modelLoaded = false;
    let vehicleLength = 1.85;
    let rearAxleZ = 0.75;
    let bodyClearance = 0.18;

    function clearVehicle() {
      while (vehicle.children.length) vehicle.remove(vehicle.children[0]);
      importedWheelGroups = [];
    }

    function makeWheel(radius = 0.34, tube = 0.12) {
      const group = new THREE.Group();
      const tire = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 12, 24), new THREE.MeshStandardMaterial({ color: 0x1f2427, roughness: 0.92 }));
      tire.rotation.y = Math.PI / 2;
      tire.castShadow = tire.receiveShadow = true;
      group.add(tire);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.45, radius * 0.45, tube * 1.05, 16), new THREE.MeshStandardMaterial({ color: 0xb8c1c6, roughness: 0.45, metalness: 0.15 }));
      hub.rotation.z = Math.PI / 2;
      hub.castShadow = hub.receiveShadow = true;
      group.add(hub);
      return group;
    }

    function buildFallbackATV() {
      clearVehicle();
      const shell = new THREE.Group();
      const red = mat(0xb61d24, 0.7);
      const dark = mat(0x1d2024, 0.85);
      const gray = mat(0x9ea7ac, 0.75);
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.33, 1.7), red);
      body.position.set(0, 0.86, 0.05);
      body.castShadow = body.receiveShadow = true;
      shell.add(body);
      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.72), dark);
      seat.position.set(0, 1.12, 0.08);
      seat.castShadow = seat.receiveShadow = true;
      shell.add(seat);
      const rackF = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 0.38), gray);
      rackF.position.set(0, 1.05, -0.76);
      rackF.castShadow = true;
      shell.add(rackF);
      const rackR = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.45), gray);
      rackR.position.set(0, 1.02, 0.87);
      rackR.castShadow = true;
      shell.add(rackR);
      vehicle.add(shell);
      const wheelPositions = [
        [-0.78, 0.45, -0.72],
        [ 0.78, 0.45, -0.72],
        [-0.78, 0.45,  0.72],
        [ 0.78, 0.45,  0.72],
      ];
      for (const pos of wheelPositions) {
        const w = makeWheel(0.33, 0.13);
        w.position.set(...pos);
        vehicle.add(w);
        importedWheelGroups.push(w);
      }
      importedModel = null;
      vehicleLength = 1.7;
      rearAxleZ = 0.72;
      bodyClearance = 0.14;
      modelLoaded = false;
    }

    buildFallbackATV();

    const loader = new GLTFLoader();
    const tmpBox = new THREE.Box3();
    const tmpSize = new THREE.Vector3();
    const tmpCenter = new THREE.Vector3();
    const modelStatus = document.getElementById('modelStatus');

    function normalizeImportedModel(model) {
      model.updateMatrixWorld(true);
      tmpBox.setFromObject(model);
      tmpBox.getSize(tmpSize);
      if (tmpSize.x > tmpSize.z * 1.2) {
        model.rotation.y = -Math.PI / 2;
        model.updateMatrixWorld(true);
        tmpBox.setFromObject(model);
        tmpBox.getSize(tmpSize);
      }
      // Forzar que mire hacia el frente de la carretera.
      model.rotation.y += Math.PI;
      model.updateMatrixWorld(true);
      tmpBox.setFromObject(model);
      tmpBox.getSize(tmpSize);

      const scale = 2.45 / Math.max(tmpSize.x, tmpSize.z);
      model.scale.setScalar(scale);
      model.updateMatrixWorld(true);
      tmpBox.setFromObject(model);
      tmpBox.getCenter(tmpCenter);
      tmpBox.getSize(tmpSize);

      const lift = 0.22;
      model.position.set(model.position.x - tmpCenter.x, model.position.y - tmpBox.min.y + lift, model.position.z - tmpCenter.z);
      model.updateMatrixWorld(true);

      model.traverse(obj => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
        }
      });

      vehicleLength = tmpSize.z;
      rearAxleZ = tmpSize.z * 0.33;
      bodyClearance = lift;

      const halfW = tmpSize.x * 0.47;
      const halfL = tmpSize.z * 0.35;
      const wheelY = lift + tmpSize.y * 0.17;
      const wheelR = Math.max(0.24, Math.min(tmpSize.y * 0.16, tmpSize.x * 0.13));
      const wheelT = wheelR * 0.35;
      importedWheelGroups = [];
      const positions = [
        [-halfW, wheelY, -halfL],
        [ halfW, wheelY, -halfL],
        [-halfW, wheelY,  halfL],
        [ halfW, wheelY,  halfL],
      ];
      for (const pos of positions) {
        const w = makeWheel(wheelR, wheelT);
        w.position.set(...pos);
        vehicle.add(w);
        importedWheelGroups.push(w);
      }
    }

    function useFourtrax(sceneModel) {
      clearVehicle();
      importedModel = sceneModel;
      vehicle.add(importedModel);
      normalizeImportedModel(importedModel);
      modelLoaded = true;
      modelStatus.textContent = '✓ HONDA FOURTRAX 3D CARGADO';
    }

    function loadFourtrax(source) {
      return new Promise((resolve, reject) => {
        const temp = typeof source === 'string' ? null : URL.createObjectURL(source);
        loader.load(temp || source, gltf => {
          if (temp) URL.revokeObjectURL(temp);
          try {
            useFourtrax(gltf.scene);
            resolve();
          } catch (err) { reject(err); }
        }, undefined, err => {
          if (temp) URL.revokeObjectURL(temp);
          reject(err);
        });
      });
    }

    function openModelStorage() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('IndexedDB no disponible')); return; }
        const req = indexedDB.open('WheelieFourtrax', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('files');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function savedModelFile() {
      const db = await openModelStorage();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readonly');
        const req = tx.objectStore('files').get('fourtrax');
        req.onsuccess = () => { resolve(req.result); db.close(); };
        req.onerror = () => { reject(req.error); db.close(); };
      });
    }
    async function persistModel(file) {
      const db = await openModelStorage();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put(file, 'fourtrax');
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error); };
      });
    }

    const fileButton = document.getElementById('pickModel');
    const fileInput = document.getElementById('modelFile');
    fileButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      modelStatus.textContent = 'Cargando modelo ' + (file.size / 1048576).toFixed(1) + ' MB…';
      try {
        await loadFourtrax(file);
        await persistModel(file);
      } catch (err) {
        console.error(err);
        modelStatus.textContent = 'Error al cargar: elige un archivo .glb válido';
        buildFallbackATV();
      }
      fileInput.value = '';
    });

    (async () => {
      try { await loadFourtrax('./assets/3d-honda-fourtrax-atv.glb'); return; } catch (err) { console.info('Archivo remoto aún no cargado.', err); }
      try { const saved = await savedModelFile(); if (saved) { await loadFourtrax(saved); return; } } catch (err) { console.info('Sin modelo guardado.', err); }
      modelStatus.textContent = 'Elige el Honda Fourtrax .glb para usarlo';
    })();

    const keys = { gas: false, lift: false, up: false, down: false };
    document.querySelectorAll('[data-key]').forEach(btn => {
      const key = btn.dataset.key;
      const set = value => { keys[key] = value; btn.classList.toggle('pressed', value); };
      btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); set(true); });
      for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) btn.addEventListener(ev, () => set(false));
    });

    const keymap = { ArrowUp: 'gas', Space: 'lift', ArrowLeft: 'down', ArrowRight: 'up', KeyW: 'gas', KeyS: 'down', KeyD: 'up' };
    addEventListener('keydown', e => { if (keymap[e.code]) { keys[keymap[e.code]] = true; e.preventDefault(); } });
    addEventListener('keyup', e => { if (keymap[e.code]) keys[keymap[e.code]] = false; });

    let active = false;
    let speed = 0;
    let tilt = 0;
    let elapsed = 0;
    let distance = 0;
    let wheelSpin = 0;
    let wasWheelie = false;
    let last = performance.now();
    let record = Number(localStorage.getItem('wheelie-best') || 0);

    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const angleEl = document.getElementById('angle');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('start');
    bestEl.textContent = record.toFixed(2) + ' s';

    function reset() {
      document.body.classList.add('playing');
      active = true;
      speed = 0;
      tilt = 0;
      elapsed = 0;
      distance = 0;
      wheelSpin = 0;
      wasWheelie = false;
      rider.position.set(0, 0, 0);
      rearPivot.position.set(0, bodyClearance + 0.17, rearAxleZ);
      vehicle.position.set(0, -(bodyClearance + 0.17), -rearAxleZ);
      rearPivot.rotation.set(0, 0, 0);
      messageEl.textContent = '¡ACELERA!';
      startBtn.hidden = true;
    }
    startBtn.addEventListener('click', reset);

    function finish() {
      document.body.classList.remove('playing');
      active = false;
      if (elapsed > record) {
        record = elapsed;
        localStorage.setItem('wheelie-best', record.toFixed(3));
        bestEl.textContent = record.toFixed(2) + ' s';
      }
      messageEl.textContent = '¡INTENTO TERMINADO! ' + elapsed.toFixed(2) + ' s';
      startBtn.textContent = 'REINTENTAR';
      startBtn.hidden = false;
    }

    function updateRoadWrap() {
      ground.position.z = rider.position.z;
      road.position.z = rider.position.z;
      shoulder.position.z = rider.position.z;
      for (const edge of roadEdges) edge.position.z = rider.position.z;
      for (let i = 0; i < stripes.length; i++) {
        const z = 12 - i * 12;
        stripes[i].position.z = rider.position.z + ((((z + distance + 155) % 310) + 310) % 310 - 155);
      }
      for (const group of landscape) {
        group.position.z = rider.position.z + ((((group.userData.baseZ + distance + 155) % 310) + 310) % 310 - 155);
      }
    }

    function keepVehicleAboveRoad() {
      rider.updateWorldMatrix(true, true);
      tmpBox.setFromObject(vehicle);
      const minY = tmpBox.min.y;
      if (minY < 0.02) rider.position.y += 0.02 - minY;
    }

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, 0.04);
      last = now;

      if (active) {
        speed = Math.max(0, Math.min(24, speed + (keys.gas ? 9 : -6.4) * dt));
        distance += speed * dt;

        const liftForce = (keys.lift && speed > 2.8 ? 1.62 : 0) + (keys.down ? 0.92 : 0) - (keys.up ? 1.36 : 0);
        tilt += ((liftForce - 0.60 - Math.sin(tilt) * 0.16) * dt);
        tilt = Math.max(-0.05, tilt);

        const validWheelie = tilt > 0.16 && tilt < 0.98 && speed > 2;
        if (validWheelie) {
          elapsed += dt;
          wasWheelie = true;
          messageEl.textContent = '¡MANTÉN EL EQUILIBRIO!';
        } else if (wasWheelie && tilt < 0.10) {
          finish();
        } else if (tilt >= 0.98) {
          finish();
        } else if (speed < 2) {
          messageEl.textContent = '¡ACELERA PARA LEVANTAR!';
        } else {
          messageEl.textContent = '¡PRESIONA WHEELIE!';
        }

        wheelSpin += speed * dt / 0.33;
        for (const w of importedWheelGroups) w.rotation.x = wheelSpin;

        timeEl.textContent = elapsed.toFixed(2) + ' s';
        angleEl.textContent = Math.max(0, tilt * 180 / Math.PI).toFixed(0) + '°';

        rider.position.z = -distance;
        rider.position.y = Math.max(0, Math.sin(Math.max(0, tilt)) * 0.05);
        rearPivot.position.set(0, bodyClearance + 0.17, rearAxleZ);
        vehicle.position.set(0, -(bodyClearance + 0.17), -rearAxleZ);
        rearPivot.rotation.x = tilt;
        keepVehicleAboveRoad();
        updateRoadWrap();
      }

      camera.position.lerp(new THREE.Vector3(0, 2.8, rider.position.z + 6.2), 0.08);
      camera.lookAt(0, 1.15 + rider.position.y * 0.25, rider.position.z - 2.3);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(frame);
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
